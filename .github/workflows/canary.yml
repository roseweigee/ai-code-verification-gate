# Rollback drill for the ISO 8583 service on Cloud Run (real revisions, real traffic split, real rollback).
#
# Run it by hand: Actions > "Canary drill ISO 8583" > Run workflow.
#   bad  = attempt 1 exactly as the AI wrote it (declines cards in their expiry month). Expected: ROLLED BACK.
#   good = the approved release. Expected: PROMOTED.
#
# 1. remember the revision that serves traffic now (tag: stable)
# 2. deploy the canary as a new revision (tag: canary) and give it 10% of traffic
# 3. canary analysis: the same transactions go to both revisions; compare the response-code mix
# 4. mix matches  -> promote the canary to 100%
#    mix changed  -> automatic rollback: 100% back to the stable revision
name: Canary drill ISO 8583

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Code to send as the canary'
        type: choice
        options:
          - 'bad: attempt 1 (expiry-month bug)'
          - 'good: the approved release'
        default: 'bad: attempt 1 (expiry-month bug)'

concurrency:
  group: release-iso8583
  cancel-in-progress: false

env:
  REGION: asia-east1
  IMAGE: asia-east1-docker.pkg.dev/specblast/specblast/iso8583-precheck
  SERVICE: iso8583-precheck

jobs:
  canary:
    name: Canary, analysis, promote or roll back
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: 1 · Prepare the canary code
        run: |
          if [[ "${{ inputs.version }}" == bad* ]]; then
            ./run.sh canary-prepare --attempt 1
          else
            echo "Canary = the approved release in release/iso8583/"
          fi

      - name: 2 · Build and push the canary image
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet
          docker build -f deploy/release/Dockerfile -t "$IMAGE:canary-$GITHUB_RUN_ID" .
          docker push "$IMAGE:canary-$GITHUB_RUN_ID"

      - name: 3 · Remember the stable revision
        id: stable
        run: |
          REV=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json | python3 -c "
          import json, sys
          t = json.load(sys.stdin)['status']['traffic']
          print(max(t, key=lambda x: x.get('percent', 0))['revisionName'])")
          echo "Stable revision: $REV"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          gcloud run services describe "$SERVICE" --region "$REGION" --format=json | python3 -c "
          import json, sys
          t = json.load(sys.stdin)['status']['traffic']
          print(json.dumps([{'rev': x.get('revisionName', 'latest'), 'percent': x.get('percent', 0), 'tag': x.get('tag', '')} for x in t], separators=(',', ':')))" > before.json
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --update-tags "stable=$REV" --quiet

      - name: 4 · Deploy the canary and give it 10% of traffic
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE:canary-$GITHUB_RUN_ID" --region "$REGION" \
            --no-traffic --tag canary --max-instances 1 --memory 1Gi --cpu 1 --set-env-vars APP=canary --quiet
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-tags canary=10 --quiet
          gcloud run services describe "$SERVICE" --region "$REGION" --format=json | python3 -c "
          import json, sys
          t = json.load(sys.stdin)['status']['traffic']
          print(json.dumps([{'rev': x.get('revisionName', 'latest'), 'percent': x.get('percent', 0), 'tag': x.get('tag', '')} for x in t], separators=(',', ':')))" > during.json
          gcloud run services describe "$SERVICE" --region "$REGION" --format='table(status.traffic[].revisionName,status.traffic[].percent,status.traffic[].tag)'

      - name: 5 · Canary analysis + AIOps incident analysis
        id: analysis
        continue-on-error: true
        shell: bash
        run: |
          read STABLE_URL CANARY_URL < <(gcloud run services describe "$SERVICE" --region "$REGION" --format=json | python3 -c "
          import json, sys
          t = {x.get('tag'): x.get('url') for x in json.load(sys.stdin)['status']['traffic'] if x.get('tag')}
          print(t['stable'], t['canary'])")
          set +e
          ./run.sh canary-check --stable "$STABLE_URL" --canary "$CANARY_URL" --n 600 | tee analysis.txt
          exit ${PIPESTATUS[0]}

      - name: 6 · Promote the canary
        if: steps.analysis.outcome == 'success'
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest --quiet
          NEW=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.latestReadyRevisionName)')
          # the promoted revision becomes the new stable one
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --remove-tags canary --quiet || true
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --update-tags "stable=$NEW" --quiet
          { echo "## ✅ Canary PROMOTED"; echo '```'; cat analysis.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 6 · Automatic rollback
        if: steps.analysis.outcome != 'success'
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${{ steps.stable.outputs.rev }}=100" --quiet
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --remove-tags canary --quiet
          gcloud run services describe "$SERVICE" --region "$REGION" --format='table(status.traffic[].revisionName,status.traffic[].percent,status.traffic[].tag)'
          {
            echo "## ↩️ Canary ROLLED BACK automatically"
            echo "All traffic is back on **${{ steps.stable.outputs.rev }}**. No person had to step in."
            echo '```'; cat analysis.txt 2>/dev/null || echo "analysis did not finish"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Canary rejected: its response-code mix changed. Traffic was rolled back to ${{ steps.stable.outputs.rev }}."
          exit 1

      - name: 7 · Report to the console
        if: always()
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" --format=json | python3 -c "
          import json, sys
          t = json.load(sys.stdin)['status']['traffic']
          print(json.dumps([{'rev': x.get('revisionName', 'latest'), 'percent': x.get('percent', 0), 'tag': x.get('tag', '')} for x in t], separators=(',', ':')))" > after.json || echo '[]' > after.json
          for f in before during after; do
            # base64: GitHub masks lines of secrets, and the key file has lines that are just { and }
            [ -s "$f.json" ] && echo "::notice title=traffic-$f::b64:$(base64 -w0 $f.json)"
          done
          R=$(grep '^CANARY_RESULT ' analysis.txt 2>/dev/null | head -1 | cut -d' ' -f2-)
          # split: one annotation holds only a few KB
          B=$(printf '%s' "$R" | base64 -w0); i=1
          while [ -n "$B" ]; do echo "::notice title=canary-result-$i::b64:${B:0:3000}"; B=${B:3000}; i=$((i+1)); done
          echo "::notice title=canary-input::${{ inputs.version }}"
          true
