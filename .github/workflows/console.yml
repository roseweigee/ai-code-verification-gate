# The AI Code Verification Gate console as a public demo on Cloud Run.
# Every visitor gets an own workspace (own runs and audit log); the three attempts are the controlled scenario with seeded defects, so no AI key
# is needed or used. With the GH_DISPATCH_TOKEN secret, approving attempt 3 (the same SHA-256 as release/iso8583/)
# starts release.yml for that approved code; nothing else can be deployed from the demo.
# Needs the secret DEMO_PASSWORD (8+ characters). SMTP_USER / SMTP_PASSWORD turn on emails to the visitor.
name: Demo console

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'report/**'
      - 'replay/**'
      - 'spec/**'
      - 'tests/**'
      - 'config/**'
      - 'examples/**'
      - 'chain/**'
      - 'Dockerfile'
      - '.github/workflows/console.yml'
  workflow_dispatch:

concurrency:
  group: demo-console
  cancel-in-progress: true

env:
  REGION: asia-east1
  IMAGE: asia-east1-docker.pkg.dev/specblast/specblast/ai-gate-console
  SERVICE: ai-gate-console
  PRODUCTION_URL: https://iso8583-precheck-ukwryhptvq-de.a.run.app

jobs:
  deploy:
    name: Build and deploy the demo console
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets
        id: check
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
          PW: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Secret GCP_SA_KEY is missing."; exit 1; fi
          if [ ${#PW} -lt 8 ]; then
            echo "::notice title=Demo console not deployed::Add the secret DEMO_PASSWORD (8+ characters), then run this workflow again."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'
      # SpecForge (private) goes into the image for the chain page (/chain); without the token the page says so
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'
        continue-on-error: true
        with:
          repository: roseweigee/specforge
          path: specforge
          token: ${{ secrets.SPECFORGE_TOKEN || github.token }}
      # SpecBlast (private): its backend is built into the image and runs next to the console on 127.0.0.1,
      # so the chain page can send it the locked spec. SPECFORGE_TOKEN needs read access to roseweigee/specblast too.
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'
        continue-on-error: true
        with:
          repository: roseweigee/specblast
          path: specblast-src
          token: ${{ secrets.SPECFORGE_TOKEN || github.token }}
      - uses: google-github-actions/auth@v2
        if: steps.check.outputs.skip != '1'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.check.outputs.skip != '1'
      - name: Build and push the image (runs the self-test)
        if: steps.check.outputs.skip != '1'
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet
          SB=specblast-src/backend/specttocode-backend
          if [ -f "$SB/pom.xml" ]; then
            echo "SpecBlast: building its backend into the image"
            docker build --build-context specblast="$SB" -t "$IMAGE:$GITHUB_SHA" .
          else
            echo "::notice title=SpecBlast not in the image::Give SPECFORGE_TOKEN read access to roseweigee/specblast to run SpecBlast live on the chain page."
            docker build -t "$IMAGE:$GITHUB_SHA" .
          fi
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy to Cloud Run
        if: steps.check.outputs.skip != '1'
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_CALLS_PER_DAY: '30'
        run: |
          # Values go in a file, not on the command line: an email address contains "@", which breaks
          # gcloud's KEY=VALUE list syntax.
          python3 -c "
          import json, os
          # ANTHROPIC_API_KEY: only for the chain page (SpecForge reading a document, SpecBlast), AI_CALLS_PER_DAY a day
          keys = ['DEMO_PASSWORD', 'PRODUCTION_URL', 'GH_DISPATCH_TOKEN', 'ANTHROPIC_API_KEY', 'AI_CALLS_PER_DAY']
          env = {k: os.environ[k] for k in keys if os.environ.get(k)}
          if os.environ.get('SMTP_USER') and os.environ.get('SMTP_PASSWORD'):
              env['SMTP_USER'] = os.environ['SMTP_USER'].strip()
              env['SMTP_PASSWORD'] = ''.join(os.environ['SMTP_PASSWORD'].split())
          print('Demo email:', 'on' if 'SMTP_USER' in env else 'off (add the SMTP_USER and SMTP_PASSWORD secrets to turn it on)')
          print('Real CD on approval:', 'on' if 'GH_DISPATCH_TOKEN' in env else 'off (add the GH_DISPATCH_TOKEN secret to turn it on)')
          json.dump(env, open('env.yaml', 'w'))"
          # one instance: the visitors' workspaces live in its memory; session affinity keeps a browser on it
          gcloud run deploy "$SERVICE" --image "$IMAGE:$GITHUB_SHA" --region "$REGION" \
            --allow-unauthenticated --max-instances 1 --memory 4Gi --cpu 2 --timeout 300 --no-cpu-throttling \
            --session-affinity --env-vars-file env.yaml --quiet
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "::notice title=Demo console::$URL"
          { echo "## Demo console"; echo "$URL"; } >> "$GITHUB_STEP_SUMMARY"
