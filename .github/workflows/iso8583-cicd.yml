# CI/CD for the ISO 8583 authorization service generated by SpecBlast.
# Runs by itself on every push to main that touches the service or the gate:
#   1. quality gate   -> blocked? the pipeline stops, nothing is deployed
#   2. unit tests     -> mvn package
#   3. deploy         -> image to Artifact Registry, then Cloud Run
#                        (optional: a named approver, via the "production" environment)
name: SpecBlast project CI/CD (manual)

# Manual only: the real CD is release.yml, which deploys only code a human approved in the gate.
on:
  workflow_dispatch:

env:
  APP_DIR: examples/specblast-iso8583/project-fixed
  REGION: asia-east1
  IMAGE: asia-east1-docker.pkg.dev/specblast/specblast/specblast-iso8583
  SERVICE: specblast-iso8583

jobs:
  quality-gate:
    name: 1 · Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check the whole project (P1-P7)
        shell: bash
        run: |
          set +e
          ./run.sh verify-project "$APP_DIR" --label iso8583 | tee gate.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Quality gate"
            if [ "$code" = 0 ]; then echo "**PASSED**: ready for tests and deployment."; else echo "**BLOCKED**: deployment stopped. Fix the errors below and push again."; fi
            echo '```'; cat gate.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate-report
          path: runs/projects/

  test:
    name: 2 · Unit tests
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn package (runs the tests)
        working-directory: ${{ env.APP_DIR }}
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ env.APP_DIR }}/target/*.jar

  deploy:
    name: 3 · Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: specblast-demo
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ${{ env.APP_DIR }}/target
      - name: Check the GCP key secret
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret GCP_SA_KEY is empty or missing. Add it under Settings > Secrets and variables > Actions > Secrets > New repository secret."
            exit 1
          fi
          echo "GCP_SA_KEY is set (${#KEY} characters)."
          echo "$KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); print('Service account:', d.get('client_email'))" \
            || { echo "::error::GCP_SA_KEY is not valid JSON. Paste the whole content of gh-key.json, from { to }."; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet
          docker build -f deploy/iso8583/Dockerfile.run -t "$IMAGE:$GITHUB_SHA" "$APP_DIR"
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy
        id: deploy
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE:$GITHUB_SHA" --region "$REGION" \
            --allow-unauthenticated --max-instances 1 --memory 1Gi \
            --set-env-vars SPRING_PROFILES_ACTIVE=dev --quiet
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`$GITHUB_SHA\` is live: $URL" >> "$GITHUB_STEP_SUMMARY"
