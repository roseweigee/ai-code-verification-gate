# CI/CD for the ISO 8583 authorization service generated by SpecBlast.
# Runs by itself on every push to main that touches the service or the gate:
#   1. quality gate   -> blocked? the pipeline stops, nothing is deployed
#   2. unit tests     -> mvn package
#   3. deploy         -> image to Artifact Registry, then Cloud Run
#                        (optional: a named approver, via the "production" environment)
name: ISO 8583 CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'examples/specblast-iso8583/project-fixed/**'
      - 'src/**'
      - 'deploy/iso8583/**'
      - '.github/workflows/iso8583-cicd.yml'
  pull_request:
    paths:
      - 'examples/specblast-iso8583/project-fixed/**'
  workflow_dispatch:

env:
  APP_DIR: examples/specblast-iso8583/project-fixed
  REGION: asia-east1
  IMAGE: asia-east1-docker.pkg.dev/specblast/specblast/iso8583-precheck
  SERVICE: iso8583-precheck

jobs:
  quality-gate:
    name: 1 · Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check the whole project (P1-P7)
        shell: bash
        run: |
          set +e
          ./run.sh verify-project "$APP_DIR" --label iso8583 | tee gate.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Quality gate"
            if [ "$code" = 0 ]; then echo "**PASSED**: ready for tests and deployment."; else echo "**BLOCKED**: deployment stopped. Fix the errors below and push again."; fi
            echo '```'; cat gate.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate-report
          path: runs/projects/

  test:
    name: 2 · Unit tests
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn package (runs the tests)
        working-directory: ${{ env.APP_DIR }}
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ env.APP_DIR }}/target/*.jar

  deploy:
    name: 3 · Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ${{ env.APP_DIR }}/target
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet
          docker build -f deploy/iso8583/Dockerfile.run -t "$IMAGE:$GITHUB_SHA" "$APP_DIR"
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE:$GITHUB_SHA" --region "$REGION" \
            --allow-unauthenticated --max-instances 1 --memory 1Gi \
            --set-env-vars SPRING_PROFILES_ACTIVE=dev --quiet
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`$GITHUB_SHA\` is live: $URL" >> "$GITHUB_STEP_SUMMARY"
