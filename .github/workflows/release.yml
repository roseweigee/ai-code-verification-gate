# CD for the ISO 8583 authorization service.
# Starts ONLY when approved code lands in release/iso8583/. That happens when a named human approves a run
# in the quality gate (tab 02: AI writes -> six gates -> human approves -> `release` pushes it here).
#   1. verify  : approval record + code hash must match what the human approved; smoke test
#   2. deploy  : build the image, push it, deploy to Cloud Run
name: Release ISO 8583

on:
  push:
    branches: [main]
    paths:
      - 'release/iso8583/**'
  workflow_dispatch:

concurrency:
  group: release-iso8583
  cancel-in-progress: false

env:
  REGION: asia-east1
  IMAGE: asia-east1-docker.pkg.dev/specblast/specblast/iso8583-precheck
  SERVICE: iso8583-precheck

jobs:
  verify:
    name: 1 · Verify the human approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Approval record, code hash, smoke test
        shell: bash
        run: |
          set +e
          ./run.sh release-check release/iso8583 | tee check.txt
          code=${PIPESTATUS[0]}
          { echo "## Release check"; echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  deploy:
    name: 2 · Deploy to Cloud Run
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the GCP key secret
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret GCP_SA_KEY is empty or missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet
          docker build -f deploy/release/Dockerfile -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy
        id: deploy
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE:$GITHUB_SHA" --region "$REGION" \
            --allow-unauthenticated --max-instances 1 --memory 1Gi --cpu 1 \
            --set-env-vars APP=release --quiet
          # a canary drill may have pinned traffic to one revision: send everything to this release
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest --quiet
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          RUN=$(python3 -c "import json;a=json.load(open('release/iso8583/approval.json'));print(a['runId'],'attempt',a['attempt'],'approved by',a['approvedBy'])")
          echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$RUN is live: $URL" >> "$GITHUB_STEP_SUMMARY"
