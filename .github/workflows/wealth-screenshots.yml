# Takes screenshots of the LIVE wealth demo (console, run report, production service) for the documents and
# commits them to docs/screenshots/ on this branch. Running it approves try 3 in the console under the given name,
# which starts the real release pipeline, exactly as a visitor would.
name: Wealth screenshots

on:
  push:
    branches: [wealth-management]
    paths:
      - 'deploy/wealth-screenshots/**'
      - '.github/workflows/wealth-screenshots.yml'
  workflow_dispatch:
    inputs:
      name:
        description: 'Name to sign the decisions with'
        required: true
        default: 'Rhosyn Wei'

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait until no console deploy is running (a redeploy would wipe the session)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow wealth-console.yml --branch wealth-management --json status \
                -q '[.[] | select(.status != "completed")] | length')
            [ "$n" = "0" ] && exit 0
            echo "Console deploy running, waiting..."; sleep 15
          done
          exit 1
      - name: Wait until no release is running and the last one finished over 2 minutes ago (so this approval starts its own)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            read st up < <(gh run list -R "$GITHUB_REPOSITORY" --workflow wealth-release.yml --limit 1 --json status,updatedAt \
                -q '.[0] | "\(.status) \(.updatedAt)"')
            age=$(( $(date +%s) - $(date -d "$up" +%s) ))
            if [ "$st" = "completed" ] && [ "$age" -gt 130 ]; then exit 0; fi
            echo "Last release: $st, $age s ago. Waiting..."; sleep 15
          done
          exit 1
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Screenshot the live demo
        run: |
          mkdir -p docs/screenshots
          NODE_PATH=/tmp/pw/node_modules node deploy/wealth-screenshots/shoot.js \
            https://ai-gate-wealth-ukwryhptvq-de.a.run.app https://fund-precheck-ukwryhptvq-de.a.run.app \
            docs/screenshots "${{ inputs.name || 'Rhosyn Wei' }}"
          ls -la docs/screenshots
      - name: Commit the screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Screenshots of the live wealth demo [skip ci]" || echo "No change"
          git push
