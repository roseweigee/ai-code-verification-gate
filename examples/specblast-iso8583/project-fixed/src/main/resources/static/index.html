<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISO 8583 Pre-check</title>
<style>
:root { --ink:#142029; --ink2:#4B5A65; --bg:#F3F5F6; --line:#D3DBE0; --accent:#1F5F8B; --ok:#1D7A4C; --okb:#DCF1E5; --bad:#B3261E; --badb:#FBE2DF; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family: Arial, sans-serif; }
header { background:#142029; color:#E4EBEF; padding:18px 24px; }
header h1 { margin:0; font-size:20px; }
header p { margin:4px 0 0; color:#A9B7C0; font-size:14px; }
main { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
.card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
.grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
label { font-size:13px; color:var(--ink2); display:flex; flex-direction:column; gap:4px; min-width:0; }
input { width:100%; font-family:monospace; font-size:15px; padding:9px; border:1px solid var(--line); border-radius:8px; }
.row { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
button { font-size:14px; padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
button.go { background:var(--accent); color:#fff; border:none; font-weight:bold; }
.res { border-radius:10px; padding:16px; display:none; }
.res.ok { display:block; background:var(--okb); border:2px solid var(--ok); }
.res.bad { display:block; background:var(--badb); border:2px solid var(--bad); }
.big { font-family:monospace; font-size:30px; font-weight:bold; }
pre { font-size:12px; white-space:pre-wrap; margin:8px 0 0; }
table { width:100%; border-collapse:collapse; font-size:13px; }
td, th { border-bottom:1px solid var(--line); padding:6px; text-align:left; font-family:monospace; }
@media (max-width:700px) { .grid { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>ISO 8583 授權前檢查服務 · Authorization pre-check</h1>
  <p>Spring Boot service generated by SpecBlast · deployed by Cloud Build after passing the quality gate</p>
</header>
<main>
  <div class="card">
    <div class="grid">
      <label>卡號 PAN<input id="pan" value="4111111111111111"></label>
      <label>到期 YYMM<input id="expiry" value="2812"></label>
      <label>金額（分）amountMinor<input id="amountMinor" value="120000"></label>
      <label>可用餘額（分）availableMinor<input id="availableMinor" value="5000000"></label>
      <label>交易日期 transactionDate<input id="transactionDate" value="2026-10-27"></label>
    </div>
    <div class="row">
      <button data-p="normal">一般消費</button>
      <button data-p="expired">過期的卡</button>
      <button data-p="over">餘額不足</button>
      <button data-p="badpan">卡號錯誤</button>
      <button data-p="nodate">缺少交易日期</button>
      <button class="go" id="send">送出 POST /api/v1/authorizations/precheck</button>
    </div>
  </div>
  <div class="res" id="res"></div>
  <div class="card">
    <div class="row" style="margin:0 0 10px"><button id="logs">稽核紀錄 GET /precheck/logs（卡號已遮罩）</button></div>
    <div id="logout"></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = {
  normal: ['4111111111111111','2812','120000','5000000','2026-10-27'],
  expired: ['4111111111111111','2609','1000','5000','2026-10-27'],
  over: ['4111111111111111','2812','5001','5000','2026-10-27'],
  badpan: ['4111111111111112','2812','1000','5000','2026-10-27'],
  nodate: ['4111111111111111','2812','1000','5000',''],
};
const F = ['pan','expiry','amountMinor','availableMinor','transactionDate'];
document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => P[b.dataset.p].forEach((v,i) => $('#'+F[i]).value = v));
$('#send').onclick = async () => {
  const body = {};
  F.forEach(f => { const v = $('#'+f).value.trim(); if (v !== '') body[f] = f.endsWith('Minor') ? Number(v) : v; });
  const r = await fetch('/api/v1/authorizations/precheck', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  let d; try { d = await r.json(); } catch (e) { d = {}; }
  const box = $('#res');
  if (r.ok && d.data) {
    box.className = 'res ok';
    box.innerHTML = `<div>HTTP ${r.status} · ISO 8583 field 39</div><div class="big">${esc(d.data.responseCode)} · ${esc(d.data.message)}</div>`;
  } else {
    box.className = 'res bad';
    box.innerHTML = `<div>HTTP ${r.status}</div><div class="big">${esc(d.message || 'Error')}</div>`;
  }
  box.innerHTML += `<pre>${esc(JSON.stringify(d, null, 2))}</pre>`;
};
$('#logs').onclick = async () => {
  const r = await fetch('/api/v1/authorizations/precheck/logs?size=10');
  const d = await r.json();
  const rows = (d.data && d.data.content) || [];
  $('#logout').innerHTML = rows.length ? `<table><tr>${Object.keys(rows[0]).map(k => `<th>${esc(k)}</th>`).join('')}</tr>` +
    rows.map(x => `<tr>${Object.values(x).map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('') + '</table>' : '還沒有紀錄。';
};
</script>
</body>
</html>
