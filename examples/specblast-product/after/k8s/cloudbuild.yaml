steps:
  # 1. Mockito tests and the JaCoCo coverage check (mvn verify), then the SonarQube quality gate.
  #    sonar.qualitygate.wait=true makes this step fail when the quality gate fails.
  - id: test-and-sonar
    name: 'maven:3.9-eclipse-temurin-17'
    entrypoint: 'bash'
    args: ['-c', 'mvn -B verify sonar:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=roseweigee -Dsonar.projectKey=roseweigee_product -Dsonar.qualitygate.wait=true -Dsonar.token=$$SONAR_TOKEN']
    secretEnv: ['SONAR_TOKEN']

  # 1b. Known vulnerabilities in dependencies: stop on CVSS 7 or higher (an NVD API key speeds this up)
  - id: dependency-scan
    name: 'maven:3.9-eclipse-temurin-17'
    entrypoint: 'bash'
    args: ['-c', 'mvn -B org.owasp:dependency-check-maven:12.1.0:check -DfailBuildOnCVSS=7 -DnvdApiKey=$$NVD_API_KEY']
    secretEnv: ['NVD_API_KEY']

  # 2. Verification gate for AI-generated code: Java policy, CodingStyle.md, K8s manifests, pipeline.
  #    Exit code 1 (blocked) stops the build here, so unchecked code never reaches the cluster.
  - id: fetch-gate
    name: 'gcr.io/cloud-builders/git'
    args: ['clone', '--depth', '1', 'https://github.com/roseweigee/ai-code-verification-gate', '/workspace/.gate']

  - id: verify-ai-code
    name: 'eclipse-temurin:21-jdk'
    entrypoint: 'bash'
    args: ['-c', '/workspace/.gate/run.sh verify-project /workspace --label "product@$SHORT_SHA"']

  # 3. Build and push one immutable image per commit
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'buildx'
      - 'build'
      - '--platform'
      - 'linux/amd64'
      - '-t'
      - 'asia-east1-docker.pkg.dev/momo-microservices-gke/specblast/product:$COMMIT_SHA'
      - '--push'
      - '.'

  # 3b. Scan the pushed image before anything is deployed: HIGH or CRITICAL stops the build
  - id: image-scan
    name: 'aquasec/trivy:0.56.2'
    args: ['image', '--exit-code', '1', '--severity', 'HIGH,CRITICAL', '--ignore-unfixed', 'asia-east1-docker.pkg.dev/momo-microservices-gke/specblast/product:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['apply', '-f', 'k8s/namespace.yaml']
    env:
      - 'CLOUDSDK_COMPUTE_REGION=asia-east1'
      - 'CLOUDSDK_CONTAINER_CLUSTER=momo-cluster'

  # 4. Deploy exactly the image built above: IMAGE_TAG in the manifest becomes the commit SHA
  - name: 'gcr.io/cloud-builders/kubectl'
    entrypoint: 'bash'
    args: ['-c', 'sed "s|IMAGE_TAG|$COMMIT_SHA|" k8s/sit/deployment.yaml > /workspace/sit.yaml && /builder/kubectl.bash apply -f /workspace/sit.yaml']
    env:
      - 'CLOUDSDK_COMPUTE_REGION=asia-east1'
      - 'CLOUDSDK_CONTAINER_CLUSTER=momo-cluster'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/sonar-token/versions/latest
      env: 'SONAR_TOKEN'
    - versionName: projects/$PROJECT_ID/secrets/nvd-api-key/versions/latest
      env: 'NVD_API_KEY'

options:
  logging: CLOUD_LOGGING_ONLY
