<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 閉環 Pipeline</title>
<style>
:root {
  --bg: #f3f5f6; --surface: #ffffff; --sunk: #e9edef; --ink: #142029; --ink-2: #4b5a65; --ink-3: #7a8893;
  --line: #d3dbe0; --accent: #1f5f8b; --accent-soft: #dcebf5;
  --pass: #1d7a4c; --pass-soft: #dcf1e5; --fail: #b3261e; --fail-soft: #fbe2df;
  --warn: #9a6200; --warn-soft: #fbedcf; --human: #5b4bb0; --human-soft: #e7e3fa;
  --skip-soft: #eceff1; --code-bg: #f7f9fa; --dark: #142029;
  --body: -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.55; }
code, .mono { font-family: var(--mono); font-size: .92em; }
header { background: var(--dark); color: #e4ebef; padding: 18px 32px; }
header .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; max-width: 1180px; margin: 0 auto; }
header h1 { margin: 0; font-size: 23px; color: #fff; }
header p { margin: 4px 0 0; color: #b9c6ce; font-size: 14px; max-width: 760px; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 32px 80px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; margin: 0 0 18px; min-width: 0; }
.card h2 { margin: 0 0 6px; font-size: 19px; }
.muted { color: var(--ink-3); } .small { font-size: 13.5px; }

/* pipeline */
.pipe { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px; position: relative; margin: 6px 0 4px; }
.node { position: relative; border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 10px 9px; min-height: 118px; display: flex; flex-direction: column; gap: 3px; }
.node:not(:last-child)::after { content: ''; position: absolute; right: -11px; top: 38px; width: 10px; height: 2px; background: var(--line); }
.node .num { width: 24px; height: 24px; border-radius: 50%; background: var(--skip-soft); color: var(--ink-2); font-weight: 700; font-size: 12.5px; display: inline-flex; align-items: center; justify-content: center; }
.node .t { font-weight: 700; font-size: 14.5px; line-height: 1.25; }
.node .tool { font-size: 11.5px; color: var(--ink-3); }
.node .st { font-size: 12px; font-weight: 700; margin-top: auto; }
.node .nt { font-size: 11.5px; color: var(--ink-2); line-height: 1.35; overflow-wrap: anywhere; }
.node.done { border-color: var(--pass); } .node.done .num { background: var(--pass); color: #fff; } .node.done .st { color: var(--pass); }
.node.failed { border-color: var(--fail); background: var(--fail-soft); } .node.failed .num { background: var(--fail); color: #fff; } .node.failed .st { color: var(--fail); }
.node.human { border-color: var(--human); background: var(--human-soft); } .node.human .num { background: var(--human); color: #fff; } .node.human .st { color: var(--human); }
.node.running { border-color: var(--accent); background: var(--accent-soft); animation: pulse 1.4s ease-in-out infinite; } .node.running .num { background: var(--accent); color: #fff; } .node.running .st { color: var(--accent); }
.node.optional { border-style: dashed; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(31,95,139,.18); } }
.loop { margin: 10px 0 0; height: 30px; position: relative; }
.loop svg { width: 100%; height: 30px; display: block; }
.loop span { position: absolute; left: 50%; top: 13px; transform: translateX(-50%); background: #fff; padding: 0 8px; font-size: 12px; color: var(--ink-2); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 14.5px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; font-family: inherit; text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.human { background: var(--human); border-color: var(--human); color: #fff; }
.btn.danger { border-color: var(--fail); color: var(--fail); }
.btn.big { padding: 12px 22px; font-size: 16px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
input[type=text], select, textarea { font: inherit; font-size: 14.5px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
textarea { width: 100%; min-height: 54px; resize: vertical; }
label.ck { display: flex; gap: 6px; align-items: flex-start; font-size: 14px; margin: 6px 0; }
.src { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 10px 0; }
.src label { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.src label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.src b { display: block; }
.q { border-top: 1px solid var(--line); padding: 10px 0; }
.q .ask { font-size: 14px; margin-bottom: 6px; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 700; background: var(--skip-soft); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--pass-soft); color: var(--pass); } .chip.bad { background: var(--fail-soft); color: var(--fail); }
.chip.wait { background: var(--human-soft); color: var(--human); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 8px 0; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; font-size: 13px; white-space: nowrap; }
td { overflow-wrap: anywhere; }
.tablewrap { overflow-x: auto; max-width: 100%; }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow: auto; margin: 6px 0; }
details { margin: 6px 0; min-width: 0; } details > summary { cursor: pointer; font-weight: 600; font-size: 14.5px; }
details.stage { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: #fff; margin: 0 0 10px; }
details.stage > summary { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 16px; font-size: 14px; margin: 8px 0; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.msg { border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-size: 14px; overflow-wrap: anywhere; }
.msg.err { background: var(--fail-soft); color: var(--fail); } .msg.ok { background: var(--pass-soft); color: var(--pass); }
.msg.info { background: var(--accent-soft); color: var(--accent); } .msg.human { background: var(--human-soft); color: var(--human); }
.spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: s 0.8s linear infinite; display: inline-block; }
@keyframes s { to { transform: rotate(360deg); } }
@media (max-width: 980px) { .pipe { grid-template-columns: repeat(4, minmax(0, 1fr)); } .node:nth-child(4)::after { display: none; } .loop { display: none; } }
@media (max-width: 560px) { main { padding: 14px 16px 60px; } header { padding: 14px 16px; } .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); } .node:nth-child(2n)::after { display: none; } }
</style>
</head>
<body>
<header><div class="row">
  <div><h1>AI 閉環 Pipeline</h1>
  <p>放進一份規格書，按一次開始：SpecForge 整理規格 → SpecBlast 產生整個專案 → 品質閘門自動檢查。只有兩個地方需要人：PM 回答規格裡沒寫清楚的問題，以及具名的人核准上線。</p></div>
  <div class="controls" style="margin:0"><a class="btn" href="/">← 回主控台</a></div>
</div></header>
<main>
  <section class="card"><h2>Pipeline</h2><div id="pipe"></div></section>
  <div id="action"></div>
  <div id="details"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let S = null, BUSY = false, ERR = '', NAME = '', TIMER = null, OPEN = {};
try { NAME = localStorage.getItem('chain-name') || ''; } catch (e) {}

const STAGES = [
  ['spec', '規格', 'SpecForge'], ['specblast', '產生程式', 'SpecBlast'], ['gate', '品質閘門', 'P1–P7 · G1–G5'],
  ['approve', '人工核准', 'G6 具名'], ['release', '發布', 'release-check'], ['canary', '金絲雀', 'AIOps'],
  ['evidence', '證據包', '寄給收件人'], ['feedback', '回饋規格', '事故演練']];
const ST_WORD = { running: '執行中…', done: '完成', failed: '擋下 / 失敗', 'needs-answers': '等 PM 回答', 'needs-human': '等你核准', optional: '可選' };
const ST_CLS = { running: 'running', done: 'done', failed: 'failed', 'needs-answers': 'human', 'needs-human': 'human', optional: 'optional' };

async function load() {
  try { S = await (await fetch('/api/chain/state')).json(); } catch (e) { return; }
  render();
  clearTimeout(TIMER);
  if (S.running) TIMER = setTimeout(load, 2000);
}
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  return r.json().catch(() => ({ error: '伺服器沒有回應' }));
}
async function pipeline(action, params, btn) {
  if (BUSY) return;
  BUSY = true; ERR = '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 啟動中…'; }
  try {
    const d = await post('/api/chain/pipeline?action=' + action, params);
    if (d.error) ERR = d.error;
  } finally { BUSY = false; await load(); }
}
const stages = () => ((S && S.progress && S.progress.stages) || {});
const stg = k => stages()[k] || {};

function renderPipe() {
  let h = `<div class="pipe">` + STAGES.map(([k, t, tool], i) => {
    const s = stg(k), cls = ST_CLS[s.status] || '';
    return `<div class="node ${cls}"><div style="display:flex;gap:8px;align-items:center"><span class="num">${i + 1}</span><span class="t">${t}</span></div>
      <div class="tool">${esc(tool)}</div><div class="st">${esc(ST_WORD[s.status] || '尚未開始')}</div><div class="nt">${esc(s.note || '')}</div></div>`;
  }).join('') + `</div>`;
  h += `<div class="loop"><svg viewBox="0 0 1000 30" preserveAspectRatio="none" aria-hidden="true"><path d="M 937 2 V 16 H 62 V 2" fill="none" stroke="#7a8893" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M 56 9 L 62 1 L 68 9" fill="none" stroke="#7a8893" stroke-width="1.5"/></svg><span>出事時：答錯的交易回到規格，變成下一版的黃金測試</span></div>`;
  h += `<div class="legend"><span><i style="background:var(--accent)"></i>執行中</span><span><i style="background:var(--pass)"></i>完成</span><span><i style="background:var(--human)"></i>等人決定</span><span><i style="background:var(--fail)"></i>擋下</span></div>`;
  $('#pipe').innerHTML = h;
}

/* ---------- what the person does now ---------- */
function renderAction() {
  const P = (S && S.progress) || {}, st = stages();
  const started = Object.keys(st).length > 0;
  let h = '';
  if (ERR) h += `<div class="msg err">${esc(ERR)}</div>`;
  if (P.error && !S.running) h += `<div class="msg err">Pipeline 停在這裡：${esc(P.error)}</div>`;
  if (S.running) {
    const cur = STAGES.find(([k]) => stg(k).status === 'running');
    h += `<section class="card"><div class="msg info" style="margin:0"><span class="spin" style="border-color:rgba(31,95,139,.3);border-top-color:var(--accent)"></span> 正在執行：${esc(cur ? cur[1] + '：' + (stg(cur[0]).note || '') : '…')}。不用一直按，畫面會自己更新。</div></section>`;
  } else if (stg('spec').status === 'needs-answers') {
    h += answerCard();
  } else if (stg('approve').status === 'needs-human') {
    h += approveCard();
  } else if (stg('evidence').status === 'done') {
    h += doneCard();
  }
  if (!S.running) h += startCard(started);
  $('#action').innerHTML = h;
  bind();
}
function startCard(started) {
  const ai = S.aiEnabled, left = S.aiLeft, ups = S.uploadsLeft;
  const aiNote = !ai ? '這台伺服器沒有 AI 金鑰：只能用範例。' : left != null ? `雲端示範的限制：今天全站還剩 ${left} 次 AI 呼叫；你還可以上傳 ${ups} 份；每份 ${Math.round(S.uploadMaxBytes / 1000)} KB 以內。` : '';
  const sbNote = S.specblastLive ? 'SpecBlast 會即時產生程式（約 3 分鐘）。' : '這台伺服器沒有啟動 SpecBlast：只有「已回答版」能用 SpecBlast 先前的真實產出繼續。';
  const body = `<p class="small" style="margin:4px 0 0">選一份規格書，填你的名字（規格由你鎖版），按開始。${esc(sbNote)}</p>
    <div class="src">
      <label><input type="radio" name="src" value="ref" checked><span><b>已回答版</b><span class="small muted">PM 已回答完所有問題，會一路跑到等你核准</span></span></label>
      <label><input type="radio" name="src" value="pm-a"><span><b>PM A 的 Email</b><span class="small muted">AI 抽取的結果，會停下來等 PM 回答 15 個問題</span></span></label>
      <label><input type="radio" name="src" value="pm-b"><span><b>PM B 的 User Stories</b><span class="small muted">同一個需求的另一種寫法</span></span></label>
      <label><input type="radio" name="src" value="pm-c"><span><b>PM C 的 Jira 單</b><span class="small muted">.docx 的寫法</span></span></label>
      <label${ai ? '' : ' style="opacity:.5"'}><input type="radio" name="src" value="upload"${ai ? '' : ' disabled'}><span><b>上傳我的規格書</b><span class="small muted">.md .txt .html .docx .pdf</span><input type="file" id="file" accept=".md,.txt,.html,.htm,.docx,.pdf" style="margin-top:6px;max-width:100%"${ai ? '' : ' disabled'}></span></label>
    </div>
    ${aiNote ? `<div class="small muted">${esc(aiNote)}</div>` : ''}
    <div class="controls"><input type="text" id="by" placeholder="你的名字" value="${esc(NAME)}" maxlength="60" style="width:180px"><button class="btn primary big" id="go">${started ? '重新開始 Pipeline' : '▶ 開始 Pipeline'}</button></div>`;
  return started ? `<details class="card"><summary>重新開始（換一份規格書）</summary>${body}</details>` : `<section class="card"><h2>開始</h2>${body}</section>`;
}
function answerCard() {
  const D = S.s1 || {}, items = (D.answers || []);
  const errWhere = new Set((D.findings || []).filter(f => f.severity === 'ERROR').map(f => (f.code || '') + ' ' + (f.where || '')));
  const must = items.filter(x => errWhere.has(x.question)), opt = items.filter(x => !errWhere.has(x.question));
  const q = (x, i, req) => `<div class="q"><div class="ask">${req ? '<span class="chip bad">必答</span> ' : ''}<span class="mono small muted">${esc(x.question)}</span> ${esc(x.ask)}</div><textarea data-q="${i}" placeholder="PM 的回答"></textarea></div>`;
  const all = [...must, ...opt];
  return `<section class="card" style="border-color:var(--human)"><h2>步驟 1 停下來了：PM 要先回答 ${must.length} 個問題</h2>
    <p class="small" style="margin:0">規格書沒寫清楚的地方，SpecForge 不讓 AI 猜，所以還不能鎖版、不能交給 SpecBlast。請以 PM 的身分回答；送出後 SpecForge 的 AI 會把答案寫回規格，再檢查一次，沒有 ERROR 就自動往下跑。答案有時會帶出新的問題（例如兩個答案互相矛盾），這時會再停下來問。</p>
    <p class="small muted" style="margin:6px 0 0">回答裡不要寫完整卡號：答案會寫進規格，閘門的 DLP 會把看起來像真實卡號的內容擋下。舉例時寫「一張有效的測試卡」即可。</p>
    <div id="qs">${must.map((x, i) => q(x, i, true)).join('')}${opt.length ? `<details><summary class="small">另外 ${opt.length} 個建議回答的問題（WARNING）</summary>${opt.map((x, i) => q(x, i + must.length, false)).join('')}</details>` : ''}</div>
    <div class="controls"><button class="btn human big" id="answer">送出答案，繼續 Pipeline</button><span class="small muted">會用掉 1 次 AI 呼叫</span></div></section>`;
  // all is used in bind through S.s1.answers ordering
}
function approveCard() {
  const R = S.run, Pj = S.project;
  const errs = []; if (Pj) Pj.gates.forEach(g => g.findings.forEach(f => { if (f.severity === 'ERROR') errs.push(f.rule + ' ' + f.title); }));
  let high = 0; if (R) R.gates.forEach(g => { if (g.id === 'G5' && g.details && g.details.highFindings) high = g.details.highFindings; });
  return `<section class="card" style="border-color:var(--human)"><h2>步驟 4：機器的檢查都跑完了，等你決定</h2>
    <p class="small" style="margin:0">先看下面「3 品質閘門」的結果（P1–P7、G1–G5）。核准之後，Pipeline 會自動發布、跑金絲雀、產生證據包並寄給收件人。</p>
    <div class="controls"><input type="text" id="appby" placeholder="你的名字" value="${esc(NAME)}" maxlength="60" style="width:180px"><input type="text" id="appnote" placeholder="備註（可不填）" style="flex:1 1 240px"></div>
    ${errs.length ? `<label class="ck"><input type="checkbox" id="accept"> <span>我接受專案的已知問題：${esc(errs.join('；'))}（會具名寫進核准紀錄）</span></label>` : ''}
    ${high ? `<label class="ck"><input type="checkbox" id="ackhigh"> <span>AI 審查有 ${high} 個 HIGH 問題，我接受這個風險</span></label>` : ''}
    <div class="controls"><button class="btn human big" id="approve">核准，繼續 Pipeline</button></div></section>`;
}
function doneCard() {
  const fb = stg('feedback').status;
  return `<section class="card" style="border-color:var(--pass)"><h2>Pipeline 跑完了</h2>
    <div class="controls">${S.evidence ? `<a class="btn primary" href="/api/chain/evidence" target="_blank" rel="noopener">打開上線證據包</a>` : ''}
    ${fb !== 'done' ? `<button class="btn danger" id="drill">跑事故演練：出事時怎麼回到規格</button>` : ''}
    <a class="btn" href="/" target="_blank" rel="noopener">設定收件人（主控台 → 📬 收件匣）</a></div>
    ${fb !== 'done' ? `<p class="small muted" style="margin:0">事故演練：把一個植入已知缺陷的版本當成金絲雀上線 → AIOps 抓到答案改變的交易 → SpecForge 把它們變成新範例、鎖成 v1.1 → 閘門用 v1.1 重跑。</p>` : ''}</section>`;
}

/* ---------- details per stage ---------- */
function chipCls(s) { return { PASSED: 'ok', PASS: 'ok', FAILED: 'bad', BLOCKED: 'bad', WARNING: 'warn', SKIPPED: '', READY_FOR_HUMAN_APPROVAL: 'wait', APPROVED: 'ok', PROMOTE: 'ok', ROLLBACK: 'bad' }[s] || ''; }
function gateRows(gates) {
  return `<div class="tablewrap"><table><tr><th>關卡</th><th>檢查</th><th>狀態</th><th>結果</th></tr>` + gates.map(g =>
    `<tr><td class="mono">${esc(g.id)}</td><td>${esc(g.name)}</td><td><span class="chip ${chipCls(g.status)}">${esc(g.status)}</span></td><td class="small">${esc(g.summary ?? `${g.errors} error · ${g.warnings} warning`)}</td></tr>`).join('') + `</table></div>`;
}
function logsFor(stage) {
  const L = ((S.progress || {}).logs || []).filter(x => x.stage === stage);
  if (!L.length) return '';
  return `<details><summary class="small">執行的指令與輸出（${L.length}）</summary>` + L.map(x =>
    `<div class="small muted" style="margin-top:8px">$ ${esc(x.command)} <span class="chip ${x.exitCode === 0 ? 'ok' : 'bad'}">exit ${esc(x.exitCode)}</span></div>${x.note ? `<div class="small">${esc(x.note)}</div>` : ''}<pre>${esc(String(x.output || '').trim())}</pre>`).join('') + `</details>`;
}
function dSpec() {
  const D = S.s1; if (!D) return '';
  const f = D.findings || [], err = f.filter(x => x.severity === 'ERROR'), warn = f.filter(x => x.severity === 'WARNING'), sp = D.spec || {};
  let b = '';
  if (D.source) b += `<details><summary class="small">PM 原始文件</summary><pre>${esc(D.source)}</pre></details>`;
  b += `<div class="controls"><span class="chip ${err.length ? 'bad' : 'ok'}">${err.length} 個 ERROR</span><span class="chip ${warn.length ? 'warn' : 'ok'}">${warn.length} 個 WARNING</span></div>`;
  b += `<div class="tablewrap"><table><tr><th>規則</th><th>內容（依順序，第一條成立的決定結果）</th><th>結果碼</th><th>範例</th></tr>` +
    (sp.rules || []).map(r => `<tr><td class="mono">${esc(r.id)}</td><td>${esc(r.text)}</td><td class="mono">${esc(r.result)}</td><td>${(r.examples || []).length}</td></tr>`).join('') + `</table></div>`;
  if (D.approval) b += `<dl class="kv"><dt>鎖版人</dt><dd>${esc(D.approval.by)}</dd><dt>時間</dt><dd>${esc(D.approval.at)}</dd><dt>版本</dt><dd>v${esc(D.approval.version)}</dd><dt>SHA-256</dt><dd class="mono">${esc(D.approval.sha256)}</dd></dl>`;
  if (D.exported && D.exported.length) b += `<div class="small">匯出：${D.exported.map(x => `<code>${esc(x)}</code>`).join('、')}${D.goldenCount != null ? `，黃金測試 ${D.goldenCount} 個` : ''}</div>`;
  return b;
}
function dSpecblast() {
  const D = S.s2; if (!D) return '';
  let b = `<div class="small">${(S.progress || {}).specblast === 'live' ? 'SpecBlast 剛剛依這份規格產生' : '2026-11-02 SpecBlast 依同一份規格真實產生、沒有手改'}的專案，共 ${D.files.length} 個檔案。規則類別：<code>${esc(D.rulesPath || '找不到 AuthorizationRules.java')}</code></div>`;
  if (D.requirements) b += `<details><summary class="small">送給 SpecBlast 的 requirements.md</summary><pre>${esc(D.requirements)}</pre></details>`;
  b += `<details><summary class="small">檔案清單</summary><pre>${esc(D.files.join('\n'))}</pre></details>`;
  if (D.rules) b += `<details><summary class="small">AuthorizationRules.java</summary><pre>${esc(D.rules)}</pre></details>`;
  return b;
}
function dGate() {
  const R = S.run, Pj = S.project; let b = '';
  if (Pj) {
    b += `<div class="small"><b>整個專案 P1–P7</b>：<span class="chip ${chipCls(Pj.verdict)}">${esc(Pj.verdict)}</span></div>` + gateRows(Pj.gates);
    const errs = []; Pj.gates.forEach(g => g.findings.forEach(f => { if (f.severity === 'ERROR') errs.push(f); }));
    if (errs.length) b += `<ul class="small">` + errs.map(f => `<li><b>${esc(f.rule)}</b> ${esc(f.title)} <span class="muted mono">${esc(f.file || '')}</span></li>`).join('') + `</ul>`;
  }
  if (R) {
    const sp = R.specSource || {};
    b += `<div class="small" style="margin-top:10px"><b>規則類別 G1–G6</b>：<span class="chip ${chipCls(R.verdict)}">${esc(R.verdict)}</span> · 依據規格 ${esc(sp.title || '')} v${esc(sp.version || '?')}（${esc(sp.approvedBy || '')} 鎖版）</div>` + gateRows(R.gates);
    if (R.autoFix && typeof R.autoFix === 'object') {
      const F = R.autoFix, f0 = (F.found || [])[0] || {};
      b += `<div class="msg" style="background:var(--warn-soft);color:var(--warn)">閘門自動修正（${esc(F.rule)}）：${esc(f0.description || '')} 時程式 ${esc(f0.detail || f0.actual || '')}，規格要求回 ${esc(f0.expected || '')}。閘門補上防護後所有關卡重跑。</div>`;
    }
  }
  return b;
}
function dApprove() {
  const R = S.run; if (!R) return '';
  const g6 = R.gates.find(g => g.id === 'G6');
  return g6 && g6.details && g6.details.decision ? `<dl class="kv"><dt>決定</dt><dd>${esc(g6.details.decision)}</dd><dt>核准人</dt><dd>${esc(g6.details.decidedBy)}</dd><dt>時間</dt><dd>${esc(g6.details.decidedAt)}</dd><dt>備註</dt><dd>${esc(g6.details.note)}</dd></dl>` : '';
}
function dRelease() {
  const Rel = S.release; if (!Rel) return '';
  const sp = Rel.specSource || {};
  return `<dl class="kv"><dt>發布的執行</dt><dd class="mono">${esc(Rel.runId)}</dd><dt>核准人</dt><dd>${esc(Rel.approvedBy)}</dd><dt>依據規格</dt><dd>${esc(sp.title || '')} v${esc(sp.version || '')}，${esc(sp.approvedBy || '')} 鎖版</dd><dt>程式指紋</dt><dd class="mono">${esc(Rel.candidateSha256)}</dd></dl>`;
}
function canaryHtml(C, title) {
  if (!C) return '';
  let h = `<div style="margin-top:8px"><b>${title}</b>：<span class="chip ${chipCls(C.verdict)}">${C.verdict === 'PROMOTE' ? 'PROMOTE 可以上線' : 'ROLLBACK 自動回滾'}</span> · ${esc(C.n)} 筆相同交易</div>`;
  h += `<div class="tablewrap"><table><tr><th>回應碼</th><th>舊版</th><th>新版</th></tr>` + (C.rows || []).map(r =>
    `<tr><td class="mono">${esc(r.code)}</td><td>${(r.stable * 100).toFixed(1)}%</td><td${Math.abs(r.canary - r.stable) > 0.003 ? ' style="color:var(--fail);font-weight:700"' : ''}>${(r.canary * 100).toFixed(1)}%</td></tr>`).join('') + `</table></div>`;
  const G = (C.incident || {}).groups || [];
  if (G.length) h += `<div class="tablewrap"><table><tr><th>舊版 → 新版</th><th>筆數</th><th>共同點</th><th>追到</th></tr>` + G.map(g =>
    `<tr><td class="mono">${esc(g.from)} → ${esc(g.to)}</td><td>${esc(g.count)}</td><td class="small">${esc(g.zh || g.en || '')}</td><td class="mono small">${esc(g.rule || '')}${g.line ? ' 第 ' + esc(g.line) + ' 行' : ''}</td></tr>`).join('') + `</table></div>`;
  return h;
}
function dEvidence() {
  return S.evidence ? `<div class="controls"><a class="btn" href="/api/chain/evidence" target="_blank" rel="noopener">打開上線證據包</a><span class="small muted">已寄給勾選「上線證據包」的收件人，附件 evidence.html 與 manifest.json</span></div>` : '';
}
function mdTable(md) {
  const lines = String(md || '').split('\n'); let h = '', inT = false, head = true;
  for (const l of lines) {
    const t = l.trim();
    if (t.startsWith('|')) {
      if (/^\|[\s\-|]+\|$/.test(t)) continue;
      const cells = t.slice(1, -1).split(' | ');
      if (!inT) { h += '<div class="tablewrap"><table>'; inT = true; head = true; }
      h += '<tr>' + cells.map(c => head ? `<th>${esc(c)}</th>` : `<td class="small">${esc(c).replace(/`([^`]+)`/g, '<code>$1</code>')}</td>`).join('') + '</tr>'; head = false;
    } else { if (inT) { h += '</table></div>'; inT = false; } if (t.startsWith('- ')) h += `<div class="small">• ${esc(t.slice(2))}</div>`; }
  }
  return h + (inT ? '</table></div>' : '');
}
function dFeedback() {
  const D = S.s7; let b = canaryHtml(S['canary-drill'], '事故演練（植入已知缺陷的版本）');
  if (!D) return b;
  b += `<div class="controls"><span class="chip ok">新增 ${D.added} 個範例</span><span class="chip ${D.questions.length ? 'bad' : 'ok'}">${D.questions.length} 個問題要 PM 回答</span>${D.approval ? `<span class="small">v1.1 由 ${esc(D.approval.by)} 鎖版</span>` : ''}</div>`;
  b += `<details><summary class="small">事故報告（incident.md）</summary>${mdTable(D.report)}</details>`;
  if (D.reruns && D.reruns.length) b += `<div class="tablewrap"><table><tr><th>程式</th><th>規格</th><th>結果</th><th>G3 黃金測試</th></tr>` + D.reruns.map(r =>
    `<tr><td>${r.code === 'specblast' ? 'SpecBlast 的程式' : '植入缺陷的程式'}</td><td>v${esc(r.spec)}</td><td><span class="chip ${chipCls(r.verdict)}">${esc(r.verdict)}</span></td><td class="small">${esc(r.g3)}</td></tr>`).join('') + `</table></div>`;
  return b;
}
function renderDetails() {
  const F = { spec: dSpec, specblast: dSpecblast, gate: dGate, approve: dApprove, release: dRelease, canary: () => canaryHtml(S['canary-release'], '這次發布'), evidence: dEvidence, feedback: dFeedback };
  let h = '';
  STAGES.forEach(([k, t], i) => {
    const s = stg(k); if (!s.status) return;
    const body = F[k]() + logsFor(k);
    h += `<details class="stage" data-k="${k}"${OPEN[k] ? ' open' : ''}><summary><span class="chip ${({ done: 'ok', failed: 'bad', running: '', 'needs-answers': 'wait', 'needs-human': 'wait' })[s.status] || ''}">${i + 1}</span>${t}<span class="small muted" style="font-weight:400">${esc(s.note || '')}</span></summary>${body || '<div class="small muted">還沒有結果。</div>'}</details>`;
  });
  $('#details').innerHTML = h ? `<h2 style="font-size:17px;margin:8px 0 10px">每一步的結果</h2>` + h : '';
  document.querySelectorAll('details.stage').forEach(d => d.ontoggle = () => { OPEN[d.dataset.k] = d.open; });
}
function render() { renderPipe(); renderAction(); renderDetails(); }

function remember(v) { if (v) { NAME = v; try { localStorage.setItem('chain-name', v); } catch (e) {} } }
function bind() {
  const go = $('#go');
  if (go) go.onclick = async () => {
    const by = ($('#by').value || '').trim(); remember(by);
    const src = (document.querySelector('input[name=src]:checked') || {}).value || 'ref';
    if (!by) { ERR = '請填你的名字：規格要由具名的人鎖版。'; render(); return; }
    if (src === 'upload') {
      const f = $('#file').files[0];
      if (!f) { ERR = '請選一個檔案。'; render(); return; }
      if (f.size > S.uploadMaxBytes) { ERR = `檔案太大（上限 ${Math.round(S.uploadMaxBytes / 1000)} KB）。`; render(); return; }
      go.disabled = true; go.innerHTML = '<span class="spin"></span> 上傳中…';
      const r = await fetch('/api/chain/upload?name=' + encodeURIComponent(f.name), { method: 'POST', body: f });
      const d = await r.json().catch(() => ({ error: '上傳失敗' }));
      if (d.error) { ERR = d.error; render(); return; }
      OPEN = {}; return pipeline('start', { by, upload: d.upload }, go);
    }
    OPEN = {}; pipeline('start', { by, input: src }, go);
  };
  const an = $('#answer');
  if (an) an.onclick = () => {
    const items = (S.s1 && S.s1.answers) || [];
    const errWhere = new Set((S.s1.findings || []).filter(f => f.severity === 'ERROR').map(f => (f.code || '') + ' ' + (f.where || '')));
    const ordered = [...items.filter(x => errWhere.has(x.question)), ...items.filter(x => !errWhere.has(x.question))];
    const answers = [];
    document.querySelectorAll('#qs textarea').forEach(t => { const a = t.value.trim(); const x = ordered[+t.dataset.q]; if (a && x) answers.push({ question: x.question, ask: x.ask, answer: a, by: NAME || 'PM' }); });
    if (!answers.length) { ERR = '至少回答一題。'; render(); return; }
    pipeline('answer', { answers: JSON.stringify(answers) }, an);
  };
  const ap = $('#approve');
  if (ap) ap.onclick = () => {
    const by = ($('#appby').value || '').trim(); remember(by);
    if (!by) { ERR = '請填你的名字：上線一定要具名核准。'; render(); return; }
    pipeline('approve', { by, note: ($('#appnote') || {}).value || '', acceptFindings: String(!!($('#accept') && $('#accept').checked)), ackHigh: String(!!($('#ackhigh') && $('#ackhigh').checked)) }, ap);
  };
  const dr = $('#drill');
  if (dr) dr.onclick = () => pipeline('drill', {}, dr);
}
load();
</script>
</body>
</html>
