<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Code Verification Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f3f5f6; --surface: #ffffff; --sunk: #e9edef; --ink: #142029; --ink-2: #4b5a65; --ink-3: #7a8893;
  --line: #d3dbe0; --accent: #1f5f8b; --accent-soft: #dcebf5;
  --pass: #1d7a4c; --pass-soft: #dcf1e5; --fail: #b3261e; --fail-soft: #fbe2df;
  --warn: #9a6200; --warn-soft: #fbedcf; --human: #5b4bb0; --human-soft: #e7e3fa;
  --skip: #8c979f; --skip-soft: #eceff1; --code-bg: #f7f9fa; --hl: #fff3c4; --dark: #142029;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
button { font: inherit; cursor: pointer; }
code, .mono { font-family: var(--mono); }

header { background: var(--dark); color: #e4ebef; padding: 22px 40px 0; }
.brand { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; }
.brand h1 { font-family: var(--display); font-size: 30px; margin: 0; color: #f3f5f6; letter-spacing: .2px; }
.tagline { font-size: 15px; color: #a9b7c0; }
.tagline b { font-weight: 600; }
.t-gate { color: #6fb3e3; } .t-ai { color: #e7b04f; } .t-human { color: #a99cf2; }
nav { display: flex; gap: 4px; margin-top: 18px; }
nav button { background: transparent; border: 0; color: #a9b7c0; padding: 12px 20px; font-size: 16px; font-weight: 500; border-radius: 8px 8px 0 0; }
nav button .num { font-family: var(--mono); font-size: 13px; opacity: .7; margin-right: 8px; }
nav button.on { background: var(--bg); color: var(--ink); }
nav button:not(.on):hover { color: #f3f5f6; }

main { max-width: 1280px; margin: 0 auto; padding: 32px 40px 140px; }
.view { display: none; } .view.on { display: block; }
.lead { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
.lead h2 { font-family: var(--display); font-size: 34px; line-height: 1.1; margin: 0 0 6px; }
.lead p { margin: 0; color: var(--ink-2); max-width: 720px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 11px 18px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.human { background: var(--human); border-color: var(--human); color: #fff; }
.btn.danger { background: var(--surface); border-color: var(--fail); color: var(--fail); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-3); font-weight: 500; }
.btn:disabled { opacity: .45; cursor: default; }
.btn .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.empty { text-align: center; color: var(--ink-3); padding: 64px 24px; border: 1px dashed var(--line); border-radius: 12px; }
.chip { display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .4px; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; white-space: nowrap; }
.s-PASSED, .s-APPROVED, .s-PASS, .s-READY { background: var(--pass-soft); color: var(--pass); }
.s-FAILED, .s-BLOCKED, .s-ERROR, .s-HIGH, .s-REJECTED { background: var(--fail-soft); color: var(--fail); }
.s-WARNING, .s-WARN, .s-MEDIUM { background: var(--warn-soft); color: var(--warn); }
.s-SKIPPED, .s-LOW, .s-INFO { background: var(--skip-soft); color: var(--skip); }
.s-WAITING { background: var(--human-soft); color: var(--human); }

/* verdict hero */
.hero { display: grid; grid-template-columns: auto 1fr auto; gap: 28px; align-items: center; padding: 28px 32px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.hero .word { font-family: var(--display); font-size: 52px; font-weight: 700; line-height: 1; }
.hero.bad { border-left: 10px solid var(--fail); } .hero.bad .word { color: var(--fail); }
.hero.good { border-left: 10px solid var(--pass); } .hero.good .word { color: var(--pass); }
.hero.wait { border-left: 10px solid var(--human); } .hero.wait .word { color: var(--human); }
.hero .facts { color: var(--ink-2); font-size: 17px; }
.hero .facts b { color: var(--ink); }
.exit { font-family: var(--mono); font-size: 14px; padding: 10px 14px; border-radius: 8px; background: var(--sunk); color: var(--ink-2); text-align: right; }
.exit b { font-size: 22px; color: var(--ink); display: block; }

.compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; margin-bottom: 20px; }
.cmp { padding: 16px 20px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cmp.sel { border-color: var(--accent); }
.cmp .k { font-size: 13px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
.cmp .v { font-family: var(--display); font-size: 26px; font-weight: 700; }
.arrow { font-size: 28px; color: var(--ink-3); }

.gates { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin: 20px 0; }
.gate { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-height: 118px; }
.gate.sel { outline: 3px solid var(--accent); outline-offset: -1px; }
.gate .id { font-family: var(--mono); font-size: 13px; color: var(--ink-3); }
.gate .nm { font-weight: 600; font-size: 14px; line-height: 1.3; flex: 1; }
.gate .ct { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.gate.st-FAILED { border-top: 5px solid var(--fail); } .gate.st-WARNING { border-top: 5px solid var(--warn); }
.gate.st-PASSED { border-top: 5px solid var(--pass); } .gate.st-SKIPPED { border-top: 5px solid var(--skip); }

.findings { display: flex; flex-direction: column; gap: 12px; }
.f { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
.f.err { border-left: 6px solid var(--fail); } .f.warn { border-left: 6px solid var(--warn); }
.f .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.f .rule { font-family: var(--mono); font-size: 13px; color: var(--ink-3); }
.f .title { font-weight: 600; font-size: 17px; }
.f .where { font-family: var(--mono); font-size: 13px; color: var(--accent); margin-top: 6px; word-break: break-all; }
.f .detail { color: var(--ink-2); margin: 8px 0 0; }
.f .fix { margin: 8px 0 0; font-size: 15px; } .f .fix b { color: var(--pass); }
.code { margin-top: 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; font-family: var(--mono); font-size: 13.5px; overflow-x: auto; }
.code div { display: flex; white-space: pre; padding: 1px 0; }
.code .ln { width: 52px; flex: none; text-align: right; padding-right: 14px; color: var(--ink-3); user-select: none; }
.code .hit { background: var(--hl); font-weight: 600; }
.sub { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .7px; color: var(--ink-3); margin: 28px 0 12px; }
details.more summary { cursor: pointer; color: var(--accent); font-weight: 600; margin: 8px 0; }

/* attempts */
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; margin-bottom: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.step { padding: 14px 16px; border-right: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
.step:last-child { border-right: 0; }
.step .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: 14px; background: var(--sunk); color: var(--ink-3); flex: none; }
.step .l { font-size: 14px; font-weight: 500; line-height: 1.3; color: var(--ink-3); }
.step.done .n { background: var(--pass); color: #fff; } .step.done .l { color: var(--ink); }
.step.cur { background: var(--accent-soft); } .step.cur .n { background: var(--accent); color: #fff; } .step.cur .l { color: var(--ink); font-weight: 600; }
.step.cur.h { background: var(--human-soft); } .step.cur.h .n { background: var(--human); }

.atabs { display: flex; gap: 8px; margin-bottom: 16px; }
.atab { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: flex; gap: 10px; align-items: center; font-weight: 600; }
.atab.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.pipe { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 20px 0; }
.pg { border-radius: 10px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--accent); display: flex; flex-direction: column; gap: 6px; }
.pg.ai { border-top-color: #d99a2b; } .pg.hu { border-top-color: var(--human); }
.pg .id { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.pg .nm { font-weight: 600; font-size: 14px; line-height: 1.25; }
.legend { display: flex; gap: 20px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.big { display: flex; flex-direction: column; gap: 4px; }
.big .num { font-family: var(--display); font-size: 56px; font-weight: 700; line-height: 1; }
.big .cap { color: var(--ink-2); }
.big.good .num { color: var(--pass); } .big.bad .num { color: var(--fail); }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 9px 10px; border-bottom: 1px solid var(--sunk); vertical-align: top; }
td.mono { font-family: var(--mono); font-size: 13px; }
.bar { position: relative; height: 34px; background: var(--sunk); border-radius: 6px; margin: 6px 0 16px; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; color: #fff; font-family: var(--mono); font-weight: 600; font-size: 15px; transition: width .6s; }
.bar .thr { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 2px dashed var(--ink); }
.bar .thr span { position: absolute; top: -20px; left: -18px; font-family: var(--mono); font-size: 12px; color: var(--ink); white-space: nowrap; }
.callout { background: var(--fail-soft); border-radius: 8px; padding: 12px 16px; margin-top: 12px; font-family: var(--mono); font-size: 18px; color: var(--fail); }
.callout small { display: block; font-family: var(--body); font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
.decision { border: 2px solid var(--human); background: var(--human-soft); border-radius: 12px; padding: 22px 24px; margin-top: 16px; }
.decision h3 { margin: 0 0 6px; color: var(--human); font-family: var(--display); font-size: 24px; }
.form { display: grid; grid-template-columns: 220px 1fr; gap: 12px 16px; align-items: start; margin-top: 14px; }
.form label { font-weight: 600; padding-top: 9px; }
.form input[type=text], .form textarea { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.form textarea { min-height: 68px; resize: vertical; }
.ack { display: flex; gap: 8px; align-items: center; font-size: 15px; }
.errbox { margin-top: 12px; background: var(--fail-soft); color: var(--fail); border-radius: 8px; padding: 12px 14px; font-weight: 500; }
.note { color: var(--ink-2); font-size: 15px; }
.feedback { background: var(--accent-soft); border-radius: 8px; padding: 14px 18px; margin-top: 16px; }
.feedback b { display: block; margin-bottom: 4px; }

/* audit */
.chain { display: flex; flex-direction: column; gap: 0; }
.link { display: grid; grid-template-columns: 48px 1fr 220px; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.link .idx { font-family: var(--mono); font-weight: 600; color: var(--ink-3); }
.link .ev { font-weight: 600; }
.link .meta { color: var(--ink-2); font-size: 14px; }
.link .h { font-family: var(--mono); font-size: 12px; color: var(--ink-3); text-align: right; line-height: 1.6; }
.link .h b { color: var(--ink); font-weight: 600; }
.joint { height: 18px; margin-left: 39px; border-left: 2px solid var(--line); }
.link.broken { border-color: var(--fail); background: var(--fail-soft); }

/* command bar */
.cmdbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--dark); color: #e4ebef; font-family: var(--mono); font-size: 14px; padding: 12px 40px; display: none; z-index: 5; }
.cmdbar.on { display: block; }
.cmdbar .row { display: flex; gap: 16px; align-items: center; max-width: 1280px; margin: 0 auto; }
.cmdbar .cmd { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdbar .cmd::before { content: "$ "; color: #6fb3e3; }
.cmdbar .code0 { color: #5cc98f; } .cmdbar .code1 { color: #f08a80; }
.cmdbar button { background: transparent; border: 1px solid #2b3a44; color: #a9b7c0; border-radius: 6px; padding: 4px 10px; font-family: var(--mono); font-size: 13px; }
.cmdbar pre { max-width: 1280px; margin: 10px auto 0; max-height: 34vh; overflow: auto; color: #a9b7c0; font-size: 13px; display: none; white-space: pre-wrap; }
.cmdbar.open pre { display: block; }

@media (max-width: 1100px) {
  .gates { grid-template-columns: repeat(4, 1fr); }
  .pipe { grid-template-columns: repeat(3, 1fr); }
  .steps { grid-template-columns: 1fr; }
  .step { border-right: 0; border-bottom: 1px solid var(--line); }
  .grid2 { grid-template-columns: 1fr; }
  .hero { grid-template-columns: 1fr; }
  main { padding: 24px 16px 140px; } header { padding: 18px 16px 0; }
}
header .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.lang { display: flex; border: 1px solid #2b3a44; border-radius: 8px; overflow: hidden; flex: none; }
.lang button { background: transparent; border: 0; color: #a9b7c0; padding: 7px 14px; font-size: 14px; font-weight: 600; }
.lang button.on { background: #e4ebef; color: #142029; }
html[lang="zh-Hant"] body { font-family: var(--body), "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
html[lang="zh-Hant"] .lead h2, html[lang="zh-Hant"] .hero .word, html[lang="zh-Hant"] .brand h1, html[lang="zh-Hant"] .decision h3 { font-family: var(--body), "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-weight: 700; }
html[lang="zh-Hant"] .chip { letter-spacing: 0; }
.orig { font-size: 13px; color: var(--ink-3); margin: 6px 0 0; }
.toast { position: fixed; right: 24px; bottom: 72px; max-width: 520px; padding: 14px 18px; border-radius: 10px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.18); z-index: 6; display: none; }
.toast.on { display: block; }
.toast.ok { background: var(--pass-soft); color: var(--pass); border: 1px solid var(--pass); }
.toast.warn { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
.toast.info { background: var(--skip-soft); color: var(--ink); border: 1px solid var(--line); }
.prodsum { margin: 16px 0 8px; padding: 14px 18px; border-radius: 8px; font-size: 18px; }
.prodsum.good { background: var(--pass-soft); color: var(--pass); }
.prodsum.bad { background: var(--fail-soft); color: var(--fail); }
table.prod tr.wrong td { background: var(--fail-soft); }
table.prod .muted { color: var(--ink-2, #4b5a65); font-size: 13px; }
#inbox-btn { position: fixed; right: 24px; bottom: 84px; z-index: 7; background: #142029; color: #fff; border: 0; border-radius: 24px; padding: 12px 20px; font-size: 16px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.2); cursor: pointer; }
#inbox-btn .n { background: #D99A2B; color: #142029; border-radius: 10px; padding: 1px 8px; margin-left: 6px; font-size: 14px; }
#inbox { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); z-index: 9; background: #fff; box-shadow: -8px 0 30px rgba(0,0,0,.18); transform: translateX(105%); transition: transform .3s; display: flex; flex-direction: column; }
#inbox.on { transform: none; }
#inbox .ih { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
#inbox .ib { overflow-y: auto; padding: 14px 22px 40px; flex: 1; }
#inbox .set { background: #F3F5F6; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
#inbox .set label { display: block; font-size: 13px; color: var(--ink-2); margin: 8px 0 3px; }
#inbox .set input[type=email], #inbox .set input[type=password] { width: 100%; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
#inbox .mail { border: 1px solid var(--line); border-top: 5px solid #9A6200; border-radius: 8px; margin: 0 0 12px; }
#inbox .mail summary { padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: 15px; }
#inbox .mail summary small { display: block; font-weight: 400; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
#inbox .mail pre { margin: 0; padding: 10px 14px 14px; font-size: 12.5px; line-height: 1.45; white-space: pre-wrap; border-top: 1px solid var(--line); }
#mailpop { position: fixed; top: 20px; right: 24px; z-index: 8; width: 460px; background: #fff; border: 1px solid var(--line); border-left: 6px solid #9A6200; border-radius: 10px; padding: 12px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.18); display: none; cursor: pointer; }
#mailpop.on { display: block; animation: popin .35s ease-out; }
@keyframes popin { from { transform: translateY(-14px); opacity: 0 } to { transform: none; opacity: 1 } }
#mailpop .k { font-size: 12.5px; color: #9A6200; font-weight: 700; letter-spacing: .5px; }
#mailpop .s { font-weight: 700; margin: 3px 0; }
#mailpop .t { font-size: 13px; color: var(--ink-2); }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">
      <h1 data-i="title"></h1>
      <div class="tagline" data-i="tagline"></div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="zh">繁中</button>
    </div>
  </div>
  <nav>
    <button data-view="project" class="on"><span class="num">01</span><span data-i="tab1"></span></button>
    <button data-view="attempts"><span class="num">02</span><span data-i="tab2"></span></button>
    <button data-view="audit"><span class="num">03</span><span data-i="tab3"></span></button>
  </nav>
</header>

<main>
  <div id="hosted-box" style="display:none"></div>
  <section class="view on" id="v-project">
    <div class="lead">
      <div><h2 data-i="p.h"></h2><p data-i="p.lead"></p></div>
      <div class="actions">
        <span id="acts-product" style="display:flex;gap:12px">
          <button class="btn primary" data-act="project" data-which="before" data-i="p.before"></button>
          <button class="btn" data-act="project" data-which="after" data-i="p.after"></button>
        </span>
        <span id="acts-iso" style="display:none;gap:12px"><button class="btn primary" data-act="project" data-which="iso" data-i="s.run"></button><button class="btn" data-act="project" data-which="iso-fixed" data-i="s.runFixed"></button></span>
      </div>
    </div>
    <div id="p-sub" style="display:flex;align-items:center;gap:12px;margin:0 0 20px;flex-wrap:wrap">
      <label for="p-select" style="font-weight:600" data-i="p.pick"></label>
      <select id="p-select" style="font-size:17px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:320px">
        <option value="iso" data-i="p.subIso"></option>
        <option value="product" data-i="p.subProduct"></option>
      </select>
    </div>
    <div id="project-out"></div>
  </section>

  <section class="view" id="v-attempts">
    <div class="lead">
      <div><h2 data-i="a.h"></h2><p data-i="a.lead"></p></div>
      <div class="actions" id="attempt-actions"></div>
    </div>
    <div class="steps" id="steps"></div>
    <div id="attempt-out"></div>
    <div id="cicd-out"></div>
    <div id="monitor-out"></div>
  </section>

  <section class="view" id="v-audit">
    <div class="lead">

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = x => (Math.round(x * 1000) / 10).toFixed(1) + '%';

const st = s => esc(T[S.lang].status[s] || s);

const gateName = g => esc(zh() && ZH.gates[g.id] ? ZH.gates[g.id] : g.name);
function pick(list, text) { for (const x of list) { const m = String(text || '').match(x.match); if (m) return { x, m }; } return null; }
function ruleText(f, field) {
  if (!zh()) return f[field];
  const r = ZH.rules[f.rule];
  if (!r || !r[field]) return f[field];
  return typeof r[field] === 'function' ? r[field](f) : r[field];
}
function trText(list, text) {
  if (!zh()) return text;
  const p = pick(list, text);
  return p ? (typeof p.x.text === 'function' ? p.x.text(p.m) : p.x.text) : text;
}

  applyStatic(); if (S.state) render();
});

function lineDiff(a, b) {
  const A = (a || '').split('\n'), B = (b || '').split('\n'), n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && A[i] === B[j]) { ops.push({ k: ' ', t: A[i], o: i + 1, nn: j + 1 }); i++; j++; }
    else if (j < m && (i >= n || L[i][j + 1] > L[i + 1][j])) { ops.push({ k: '+', t: B[j], nn: j + 1 }); j++; }
    else { ops.push({ k: '-', t: A[i], o: i + 1 }); i++; }
  }
  const keep = new Set();
  ops.forEach((op, x) => { if (op.k !== ' ') for (let y = Math.max(0, x - 2); y <= Math.min(ops.length - 1, x + 2); y++) keep.add(y); });
  const out = []; let last = -1;
  [...keep].sort((p, q) => p - q).forEach(x => { if (last >= 0 && x > last + 1) out.push({ k: '…' }); out.push(ops[x]); last = x; });
  return out;
}

    const from = Math.max(1, f.line - 3), to = Math.min(lines.length, f.line + 2);
    const rows = [];
    for (let n = from; n <= to; n++) rows.push({ n, text: lines[n - 1], hit: n === f.line });
    return `<div style="margin:10px 0 4px;font-weight:600">${esc(f.id)} · ${t('a.npeAt', f.line)}</div>` + codeBlock(rows);
  }).join('');
}

      return `<div class="f ${f.severity === 'HIGH' ? 'err' : 'warn'}"><div class="top"><span class="chip s-${f.severity}">${st(f.severity)}</span><span class="rule">${esc(f.criterion)}${ln ? ' · ' + t('a.line', ln) : ''}</span><span class="title">${esc(z ? z.x.title : f.title)}</span></div>
        <p class="detail">${esc(z ? z.x.detail : f.detail)}</p>
        ${unicode ? `<div class="callout"><small>${t('a.confirmed')}</small>${t('a.approved00')}</div>` : ''}
        ${lines.length ? codeBlock(lines) : ''}</div>`;
    }).join('') + `</div>`;
  }
  const g6 = G.G6;
  const ra = r.runPath ? ` data-run="${esc(r.runPath)}"` : '';
  if (waiting) {
    const high = a?.highFindings || 0;
    const prevBy = $('#by') ? $('#by').value : 'Rhosyn Wei';
    const defNote = $('#note') ? $('#note').value : (high ? 'Full-width digits must be rejected (AC-01, AC-02). Adding regression tests G-32 and G-33.' : 'Accepted. All gates passed, including the NF-05 null guard the gate added.');
    const errMsg = S.lastError ? esc(trText(ZH.errors, S.lastError)) : '';
    h += `<div class="decision"><h3>${t('a.g6')}</h3>
      <p class="note" style="margin:0">${high ? t('a.high', high) : t('a.allPass')}</p>
      <div class="form"><label for="by">${t('a.name')}</label><input type="text" id="by" value="${esc(prevBy)}">
      <label for="note">${t('a.reason')}</label><textarea id="note">${esc(defNote)}</textarea>
      ${high ? `<span></span><label class="ack"><input type="checkbox" id="ack"> ${t('a.ack')}</label>` : ''}
      <span></span><div class="actions">${high ? `<button class="btn danger" data-act="reject"${ra}>${t('a.reject')}</button><button class="btn" data-act="approve"${ra}>${t('a.approveAnyway')}</button>` : `<button class="btn human" data-act="approve"${ra}>${t('a.approve')}</button><button class="btn danger" data-act="reject"${ra}>${t('a.reject')}</button>`}</div></div>
      ${errMsg ? `<div class="errbox">${errMsg}</div>` : ''}</div>`;
  } else if (g6 && g6.details && g6.details.decision) {
    const d = g6.details;
    h += `<div class="decision"><h3>${t('a.decided', d.decision, esc(d.decidedBy))}</h3><p class="note" style="margin:0">${esc(d.decidedAt)}${d.note ? ' · ' + esc(d.note) : ''}</p></div>`;
  }
  if (v === 'APPROVED') h += productionPanel(r);
  return h;
}
function productionPanel(r) {
  const pc = r.productionCheck;
  let h = `<div class="sub">${t('a.prod')}</div><div class="card">
    <div style="display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <p class="note" style="margin:0;max-width:70ch">${t('a.prodLead')}</p>
      <button class="btn primary" data-act="production" data-run="${esc(r.runPath || r.runId)}">${pc ? t('a.prodAgain') : t('a.prodRun')}</button></div>`;
  if (pc) {
    const ok = pc.verdict === 'ALL_CORRECT';
    h += `<div class="prodsum ${ok ? 'good' : 'bad'}">${ok ? t('a.prodOk', pc.correct, pc.scored) : t('a.prodBad', pc.scored - pc.correct, pc.scored)}</div>`;
    const c = t('a.prodCols'), R = t('a.prodRes');
    const money = v => (Number(v) / 100).toFixed(2);
    h += `<table class="prod"><tr>${c.map(x => `<th>${x}</th>`).join('')}</tr>` + pc.transactions.map(x => {
      const cls = x.outcome === 'CORRECT' ? 'PASSED' : x.outcome === 'WRONG' ? 'FAILED' : 'SKIPPED';
      const ans = x.error ? t('a.crash', esc(x.error)) : esc(x.actual);
      return `<tr class="${x.outcome === 'WRONG' ? 'wrong' : ''}"><td class="mono">${esc(x.id)}</td>
        <td><b>${esc(zh() && x.titleZh ? x.titleZh : x.title)}</b><br><span class="mono muted">${esc(x.rule)}</span></td>
        <td class="mono">${esc(x.pan)}<br>exp ${esc(x.expiry)} · ${esc(x.transactionDate ?? 'null')}<br>${money(x.amountMinor)} / ${money(x.availableMinor)}</td>
        <td class="mono">${esc(x.expected ?? '–')}</td>
        <td class="mono" style="${x.outcome === 'WRONG' ? 'color:var(--fail);font-weight:700' : ''}">${ans}</td>
        <td><span class="chip s-${cls}">${esc(R[x.outcome])}</span></td></tr>` +
        (x.outcome === 'NOT_IN_SPEC' ? `<tr><td></td><td colspan="5" class="note" style="padding-top:0">${t('a.prodNa')}</td></tr>` : '');
    }).join('') + `</table>`;
  }
  return h + `</div>`;
}

/* ================= CI/CD status ================= */
async function loadCicd(refresh) {
  const box = $('#cicd-out');
  if (!S.cicd) box.innerHTML = `<div class="card cicd"><div class="sub">${t('c.loading')}</div></div>`;
  try { S.cicd = await (await fetch('/api/cicd' + (refresh ? '?refresh=1' : ''))).json(); } catch (e) { S.cicd = { error: String(e) }; }
  renderCicd();
}
function renderCicd() {
  const C0 = S.cicd || {}, C = { ...C0, runs: sessionOnly(C0.runs) }, box = $('#cicd-out');
  const ok = c => c === 'success', icon = j => j.status !== 'completed' ? '⏳' : ok(j.conclusion) ? '✅' : j.conclusion === 'skipped' ? '⏭' : '❌';
  let h = `<div class="card cicd" style="margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
      <div><h3 style="margin:0 0 6px;font-size:22px">${t('c.h')}</h3><p class="note" style="margin:0">${t('c.lead')}${HOSTED() ? t('h.cdNote') : ''}</p></div>
      <div style="display:flex;gap:8px"><button class="btn" id="cicd-refresh">${t('c.refresh')}</button>${C.actionsUrl ? `<a class="btn" href="${esc(C.actionsUrl)}" target="_blank" rel="noopener">${t('c.all')} ↗</a>` : ''}</div></div>`;
  if (C.error) h += `<p class="note" style="color:var(--fail)">${esc(t('c.err', C.error))}</p>`;
  if (C.warning) h += `<p class="note" style="color:var(--warn)">${esc(t('c.err', C.warning))}</p>`;
  const P = (C.runs || []).length && C.runs[0].status === 'completed' && C.runs[0].conclusion === 'success' ? C.production : null;
  h += `<div style="margin:18px 0;padding:16px;border-radius:10px;${P && (P.url || P.state === 'success') ? 'background:#DCF1E5;border:2px solid #1D7A4C' : 'background:#F3F5F6;border:1px dashed var(--line)'}">`;
  h += P && P.url ? `<div style="font-weight:600">🟢 ${t('c.live')} · commit <span class="mono">${esc(P.sha)}</span> · ${esc((P.createdAt || '').replace('T', ' ').replace('Z', ' UTC'))}</div>
    <a href="${esc(P.url)}" target="_blank" rel="noopener" class="mono" style="font-size:18px">${esc(P.url)}</a> <a class="btn primary" style="margin-left:8px" href="${esc(P.url)}" target="_blank" rel="noopener">${t('c.open')} ↗</a>`
    : P && P.state === 'success' ? `<div style="font-weight:600">🟢 ${t('c.live')} · commit <span class="mono">${esc(P.sha)}</span> · ${esc((P.createdAt || '').replace('T', ' ').replace('Z', ' UTC'))}</div>`
    : `<div class="note" style="margin:0">${t('c.none')}</div>`;
  h += `</div>`;
  const runs = C.runs || [];
  // releases and rollback drills are the same pipeline step (a canary on Cloud Run): one list, newest first
  const events = runs.map(r => ({ ...r, kind: 'release' })).concat((HOSTED() ? [] : sessionOnly(C0.canary)).map(d => ({ ...d, kind: 'drill',
    message: t('c.drillMsg'), sha: '', event: 'drill' }))).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  h += `${S.drillMsg ? `<p class="note" style="margin:0 0 8px;font-weight:600">${S.drillMsg}</p>` : ''}<p class="note" style="margin:0 0 10px">${C0.fetchedAt ? t('m.updated', C0.fetchedAt) : ''}${C0.drillError ? ` · <span style="color:var(--fail)">${esc(C0.drillError)}</span>` : ''}</p>`;
  if (events.length && (events[0].steps || []).length) h += `<div style="margin:6px 0 18px">${canaryDetail(events[0], events[0].kind)}</div>`;
  if (events.length) {
    h += `<div class="sub">${t('c.runs')}</div>` + events.map(r => `<a href="${esc(r.url)}" target="_blank" rel="noopener" style="display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-left:6px solid ${r.status !== 'completed' ? '#9A6200' : ok(r.conclusion) ? '#1D7A4C' : '#B3261E'};border-radius:8px;padding:10px 14px;margin:8px 0">
      <div><b>${r.status !== 'completed' ? '⏳' : ok(r.conclusion) ? '✅' : r.kind === 'drill' ? '↩️' : '❌'} ${esc(r.message)}</b> <span class="mono" style="color:var(--ink-2)">${r.sha ? esc(r.sha) + ' · ' : ''}${esc(r.event)} · ${esc((r.createdAt || '').replace('T', ' ').replace('Z', ' UTC'))}</span></div>
      ${(r.jobs || []).length ? `<div class="mono" style="font-size:14px;margin-top:4px">${r.jobs.map(j => `${icon(j)} ${esc(j.name)}`).join(' → ')}</div>` : ''}</a>`).join('');
  }
  box.innerHTML = h + `</div>`;
  const cr = $('#cicd-refresh'); cr.onclick = async () => { cr.disabled = true; cr.innerHTML = `<span class="spin"></span> ${t('running')}`; await loadCicd(true); };
  // a run already in progress when the page opened: follow it too
  if (events.some(e => e.status !== 'completed') && !watchCd.timer) watchCd(events.find(e => e.status !== 'completed').kind);
  if (S.state && S.state.runs) renderAttempts();
}

/* ================= 4. SpecBlast x ISO 8583 ================= */
function renderSpecblast() {
  const out = $('#project-out');
  if (!S.state.specblastAvailable) { out.innerHTML = `<div class="empty">${t('s.missing')}</div>`; return; }
  const all0 = S.state.projects || {};
  if (!S.isoSel) S.isoSel = all0['specblast-iso8583'] ? 'iso' : 'iso-fixed';
  const P = all0[S.isoSel === 'iso-fixed' ? 'specblast-iso8583-fixed' : 'specblast-iso8583'];
  if (!P) { out.innerHTML = `<div class="empty">${t('s.empty')}</div>`; return; }
  const blocked = P.verdict === 'BLOCKED';
  let h = `<div class="hero ${blocked ? 'bad' : 'wait'}">
    <div class="word">${word(blocked ? 'BLOCKED' : 'READY')}</div>
    <div class="facts">${t('p.facts', P.errors, P.warnings, P.filesChecked.total, P.filesChecked.java, P.filesChecked.kubernetes)}<br>${t(blocked ? 'p.blocked' : 'p.ready')}</div>
    <div class="exit">${t('p.exit')}<b>${blocked ? 1 : 0}</b>${t(blocked ? 'p.stops' : 'p.cont')}</div></div>`;
  h += `<div class="gates">` + P.gates.map(g => `<div class="gate st-${g.status}"><span class="id">${g.id}</span><span class="nm">${gateName(g)}</span>
    <span><span class="chip s-${g.status}">${st(g.status)}</span></span><span class="ct">${g.errors} err · ${g.warnings} warn</span></div>`).join('') + `</div>`;
  const all = [];
  P.gates.forEach(g => g.findings.forEach(f => { if (f.severity !== 'PASS') all.push({ ...f, gate: g.id }); }));
  const errs = all.filter(f => f.severity === 'ERROR'), warns = all.filter(f => f.severity !== 'ERROR');
  if (errs.length) h += `<div class="sub">${t('p.errHead')}</div><div class="findings">` + errs.map((f, i) => finding(f, 'err', 'sbe' + i)).join('') + `</div>`;
  if (warns.length) h += `<details class="more"><summary>${t('p.warns', warns.length)}</summary><div class="findings">` + warns.map((f, i) => finding(f, 'warn', 'sbw' + i)).join('') + `</div></details>`;
  h += `<p class="note" style="margin-top:20px"><b>${t(S.isoSel === 'iso-fixed' ? 's.fixed' : 's.toFix')}</b></p>`;
  h += `<p class="note" style="margin-top:20px">${t('s.codeNote')}</p>`;
  out.innerHTML = h;
  errs.forEach((f, i) => { if (f.file && f.line > 0) loadSnippet('specblast', f.file, f.line, 'snip-sbe' + i); });
}

/* ================= 3. audit ================= */
function renderAudit() {
  const A = S.state.audit || { entries: [] };
  const out = $('#audit-out');
  if (!A.entries.length) { out.innerHTML = `<div class="empty">${t('u.empty')}</div>`; return; }
  const ok = !A.problem;
  let h = `<div class="hero ${ok ? 'good' : 'bad'}"><div class="word">${word(ok ? 'INTACT' : 'TAMPERED')}</div>
    <div class="facts">${ok ? t('u.ok', A.entries.length) : t('u.bad', A.entries.length, esc(trText(ZH.audit, A.problem)))}</div>
    <div class="exit">${t('u.algo')}<b>SHA-256</b>${t('u.append')}</div></div>`;
  if (S.tamper) {
    const x = S.tamper;
    h += `<div class="card" style="margin-top:16px;border-left:6px solid var(--fail)">` + (x.message ? esc(x.message) :
      `${t('u.tTitle')}<br>${esc(t('u.tEntry', x.editedEntry, t('u.change', x.change)))}<br>
       ${t('u.tResult')} <span style="color:var(--fail);font-weight:600">${esc(x.result ? trText(ZH.audit, x.result) : t('u.notDetected'))}</span>`) + `</div>`;
  }
  h += `<div class="sub">${t('u.chain')}</div><div class="chain">` + A.entries.map((e, i) => {
    const what = e.runId || e.project || e.label || '';
    const res = e.verdict ? vShort(e.verdict) : esc(T[S.lang].events[e.event] || (e.event || '').replace('HUMAN_', ''));
    const cls = e.verdict ? vClass(e.verdict) : e.event === 'HUMAN_APPROVED' ? 'APPROVED' : e.event === 'HUMAN_REJECTED' ? 'REJECTED' : 'INFO';
    const evName = zh() ? (T.zh.events[e.event] || e.event) : (e.event || '').replace(/_/g, ' ').toLowerCase();
    const by = e.decidedBy ? ` · ${t('u.by')} ${esc(e.decidedBy)}` : '';
    const broken = S.tamper && S.tamper.editedEntry === i + 1;
    return (i ? `<div class="joint"></div>` : '') + `<div class="link ${broken ? 'broken' : ''}"><span class="idx">#${i + 1}</span>
      <div><div class="ev">${esc(evName)} <span class="chip s-${cls}">${res}</span></div><div class="meta">${esc(what)}${by} · ${esc(e.at)}</div></div>
      <div class="h">prev ${esc((e.prevHash || '').slice(0, 10))}…<br>hash <b>${esc((e.entryHash || '').slice(0, 10))}…</b></div></div>`;
  }).join('') + `</div>`;
  out.innerHTML = h;
}

applyStatic();
setSub('iso');
S.asub = 'claude';
load();
</script>
